<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Audio Newsletter - Dual Host Podcast</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            max-width: 680px;
            width: 100%;
            padding: 32px;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        p.subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .input-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #2563eb; }
        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Persistent Interrupt Bar */
        .interrupt-bar {
            display: none;
            margin-top: 20px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            transition: all 0.3s;
        }
        .interrupt-bar.active {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .interrupt-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .interrupt-bar-header span {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }
        .interrupt-bar.active .interrupt-bar-header span {
            color: #b91c1c;
        }
        .chat-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
            position: relative;
        }
        .chat-input-wrapper input {
            flex: 1;
            padding: 11px 48px 11px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-send {
            position: absolute;
            right: 8px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-send:hover { background: #1d4ed8; }
        .btn-mic {
            background: #7c3aed;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-mic:hover { background: #6d28d9; }
        .btn-mic.listening {
            background: #dc2626;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .btn-stop-resume {
            width: 100%;
            background: #059669;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }
        .btn-stop-resume:hover { background: #047857; }

        /* Live Speaking & Subtitles Area */
        .now-playing {
            margin-top: 20px;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            display: none;
        }
        .speaker-badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .speaker-badge.host-a { background: #dbeafe; color: #1e40af; }
        .speaker-badge.host-b { background: #fef3c7; color: #92400e; }
        .speaker-badge.host-answer { background: #fee2e2; color: #991b1b; }
        .subtitles {
            font-size: 15px;
            line-height: 1.5;
            color: #334155;
            font-style: italic;
        }
        #status-message {
            margin-top: 14px;
            font-size: 14px;
            font-weight: 600;
            color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ Dual-Host Podcast AI</h1>
        <p class="subtitle">Enter any article URL to generate a live dual-host podcast. You can interrupt by typing or using your mic anytime!</p>
        
        <div class="input-card">
            <input type="url" id="article-url" placeholder="https://en.wikipedia.org/wiki/Artificial_intelligence" value="https://en.wikipedia.org/wiki/Artificial_intelligence" required>
            <input type="text" id="api-key" placeholder="ElevenLabs API Key (sk_...)" value="sk_5a308e5383029f6f3e95f88da7bbf0c3e18d55102a91c6a1">
            <button onclick="generatePodcast()" id="gen-btn" class="btn-primary">Generate & Start Podcast</button>
        </div>

        <div id="status-message"></div>

        <!-- Integrated Live Interrupt & Ask Bar -->
        <div id="interrupt-bar" class="interrupt-bar">
            <div class="interrupt-bar-header">
                <span id="interrupt-status-text">⏸️ Podcast Playing... Type or click Mic to interrupt!</span>
            </div>
            <div class="chat-input-wrapper">
                <input type="text" id="question-input" placeholder="Type a question to interrupt (e.g., What is AGI?)" onfocus="pauseOnInputFocus()" onkeydown="handleInputKey(event)">
                <button onclick="submitQuestion()" class="btn-send" title="Send question">➤</button>
                <button onclick="toggleMicListen()" id="mic-btn" class="btn-mic">🎙️ Speak (Mic)</button>
            </div>
            <button onclick="endQueryAndResume()" id="stop-resume-btn" class="btn-stop-resume">🛑 Got My Answer! Resume Podcast with Host A & B ▶️</button>
        </div>

        <!-- Live Subtitles & Progress -->
        <div id="now-playing" class="now-playing">
            <div id="speaker-badge" class="speaker-badge host-a">Host A</div>
            <div id="current-text" class="subtitles"></div>
        </div>
    </div>

    <script>
        const serverUrl = window.location.origin;
        const voices = {
            "Host A": "21m00Tcm4TlvDq8ikWAM", // Rachel (Female)
            "Host B": "29vD33N1CtxCmqQRPOHJ"  // Drew (Male)
        };

        let currentAudio = null;
        let globalScriptData = [];
        let rawFullScript = "";
        let currentLineIndex = 0;
        let isInterrupted = false;
        let isAnswering = false;
        let recognition = null;
        let isListeningMic = false;

        async function generatePodcast() {
            stopAllAudio();
            isInterrupted = false;
            isAnswering = false;
            currentLineIndex = 0;
            globalScriptData = [];
            
            const url = document.getElementById('article-url').value;
            const statusMsg = document.getElementById('status-message');
            document.getElementById('gen-btn').disabled = true;

            statusMsg.style.color = "#2563eb";
            statusMsg.innerText = "Scraping article & Generating dual-host script via Gemini...";
            
            try {
                const response = await fetch(`${serverUrl}/generate-podcast`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ article_url: url })
                });
                
                rawFullScript = await response.text();
                globalScriptData = parseTextScript(rawFullScript);

                if (globalScriptData.length === 0) throw new Error("No script lines could be parsed.");

                statusMsg.innerText = "✅ Script ready! Host A & Host B live broadcast started.";
                statusMsg.style.color = "#059669";
                document.getElementById('interrupt-bar').style.display = 'block';
                document.getElementById('now-playing').style.display = 'block';

                playScript(0);

            } catch (error) {
                console.error("Error:", error);
                statusMsg.innerText = "Error: " + error.message;
                statusMsg.style.color = "#dc2626";
                document.getElementById('gen-btn').disabled = false;
            }
        }

        function parseTextScript(rawText) {
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 5);
            const result = [];
            let currentHost = "Host A";

            for (let line of lines) {
                if (line.startsWith('{') || line.startsWith('}')) continue;

                const lower = line.toLowerCase();
                if (lower.includes("host b")) currentHost = "Host B";
                else if (lower.includes("host a")) currentHost = "Host A";

                let dialogue = line.replace(/\*\*Host [AB]:?\*\*/gi, '')
                                   .replace(/Host [AB]:?/gi, '')
                                   .replace(/\*/g, '')
                                   .trim();

                if (dialogue.length > 3) {
                    result.push({ speaker: currentHost, text: dialogue });
                    currentHost = (currentHost === "Host A") ? "Host B" : "Host A";
                }
            }
            return result;
        }

        async function playScript(startIndex) {
            const apiKey = document.getElementById('api-key').value.trim();

            for (let i = startIndex; i < globalScriptData.length; i++) {
                if (isInterrupted) {
                    currentLineIndex = i; // Save exact line index where paused
                    break;
                }

                currentLineIndex = i;
                const line = globalScriptData[i];
                const voiceId = voices[line.speaker] || voices["Host A"];
                
                updateSpeakerBadge(line.speaker);
                document.getElementById('current-text').innerText = `"${line.text}"`;

                let played = false;
                if (apiKey) {
                    try {
                        const ttsResponse = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                            method: 'POST',
                            headers: {
                                'xi-api-key': apiKey,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                text: line.text,
                                model_id: "eleven_monolingual_v1",
                                voice_settings: { stability: 0.5, similarity_boost: 0.5 }
                            })
                        });

                        if (ttsResponse.ok) {
                            const blob = await ttsResponse.blob();
                            currentAudio = new Audio(URL.createObjectURL(blob));
                            await new Promise(r => { currentAudio.onended = r; currentAudio.onerror = r; currentAudio.play(); });
                            played = true;
                        }
                    } catch (e) {}
                }

                if (!played && !isInterrupted && 'speechSynthesis' in window) {
                    await new Promise(r => {
                        const u = new SpeechSynthesisUtterance(line.text);
                        const av = window.speechSynthesis.getVoices();
                        u.voice = (line.speaker === "Host A") ? (av.find(v => v.name.includes("Female") || v.name.includes("Zira")) || av[0]) : (av.find(v => v.name.includes("Male") || v.name.includes("David")) || av[1] || av[0]);
                        u.onend = r; u.onerror = r; window.speechSynthesis.speak(u);
                    });
                }
            }

            if (!isInterrupted) {
                document.getElementById('now-playing').style.display = 'block';
                document.getElementById('speaker-badge').innerText = "📻 Finished";
                document.getElementById('current-text').innerText = "Podcast episode has concluded.";
                document.getElementById('gen-btn').disabled = false;
            }
        }

        function updateSpeakerBadge(speaker) {
            const badge = document.getElementById('speaker-badge');
            badge.innerText = speaker;
            badge.className = 'speaker-badge ' + (speaker === 'Host A' ? 'host-a' : (speaker === 'Host B' ? 'host-b' : 'host-answer'));
        }

        // Automatic Pause whenever user focuses the input bar to type
        function pauseOnInputFocus() {
            if (!isInterrupted && !isAnswering && globalScriptData.length > 0) {
                isInterrupted = true;
                stopAllAudio();
                const bar = document.getElementById('interrupt-bar');
                bar.classList.add('active');
                document.getElementById('interrupt-status-text').innerText = "🚨 Podcast Paused! Type your question and click ➤ or Speak on Mic";
                document.getElementById('stop-resume-btn').style.display = 'block';
            }
        }

        function handleInputKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitQuestion();
            }
        }

        // Mic listener toggle
        function toggleMicListen() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition not supported in this browser. Please type your question in the text bar!");
                return;
            }

            if (isListeningMic && recognition) {
                recognition.stop();
                return;
            }

            // Immediately pause the podcast conversation
            isInterrupted = true;
            stopAllAudio();
            const bar = document.getElementById('interrupt-bar');
            bar.classList.add('active');
            document.getElementById('stop-resume-btn').style.display = 'block';

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('listening');
            micBtn.innerText = "🛑 Listening...";
            document.getElementById('interrupt-status-text').innerText = "🎙️ Listening to your voice... Speak your question now!";
            isListeningMic = true;

            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('question-input').value = text;
                document.getElementById('interrupt-status-text').innerText = `Recognized: "${text}"`;
                submitQuestion();
            };

            recognition.onerror = (e) => {
                console.warn("Mic recognition error:", e.error);
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎙️ Speak (Mic)";
                isListeningMic = false;
                document.getElementById('interrupt-status-text').innerText = "⚠️ Voice error. Please type your question and press ➤";
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎙️ Speak (Mic)";
                isListeningMic = false;
            };

            recognition.start();
        }

        async function submitQuestion() {
            if (isAnswering) return;
            const q = document.getElementById('question-input').value.trim();
            if (!q) return;

            // Pause whatever is playing
            isInterrupted = true;
            stopAllAudio();
            isAnswering = true;

            const bar = document.getElementById('interrupt-bar');
            bar.classList.add('active');
            document.getElementById('stop-resume-btn').style.display = 'block';
            document.getElementById('interrupt-status-text').innerText = "🤔 Host A is thinking and preparing an answer...";

            const currentLine = globalScriptData[currentLineIndex] || { speaker: "Host A", text: "" };

            try {
                const response = await fetch(`${serverUrl}/ask-host`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: q,
                        currentSpeaker: currentLine.speaker,
                        currentLineText: currentLine.text,
                        fullScript: rawFullScript
                    })
                });

                const answerText = await response.text();
                document.getElementById('interrupt-status-text').innerText = "🗣️ Host A is answering your question out loud!";
                
                await speakHostAnswer("Host A (Answering)", answerText);

            } catch (err) {
                console.error("Q&A submission error:", err);
                document.getElementById('interrupt-status-text').innerText = "Error getting answer. You can resume podcast below.";
            } finally {
                isAnswering = false;
            }
        }

        async function speakHostAnswer(speaker, text) {
            const apiKey = document.getElementById('api-key').value.trim();
            const voiceId = voices["Host A"];

            updateSpeakerBadge(speaker);
            document.getElementById('current-text').innerText = `"${text}"`;

            let played = false;
            if (apiKey) {
                try {
                    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                        method: 'POST',
                        headers: { 'xi-api-key': apiKey, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text, model_id: "eleven_monolingual_v1", voice_settings: { stability: 0.5, similarity_boost: 0.5 } })
                    });
                    if (res.ok) {
                        const blob = await res.blob();
                        currentAudio = new Audio(URL.createObjectURL(blob));
                        await new Promise(r => { currentAudio.onended = r; currentAudio.onerror = r; currentAudio.play(); });
                        played = true;
                    }
                } catch (e) {}
            }

            if (!played && 'speechSynthesis' in window) {
                await new Promise(r => {
                    const u = new SpeechSynthesisUtterance(text);
                    u.voice = window.speechSynthesis.getVoices().find(v => v.name.includes("Female") || v.name.includes("Zira")) || window.speechSynthesis.getVoices()[0];
                    u.onend = r; u.onerror = r; window.speechSynthesis.speak(u);
                });
            }
        }

        // Dedicated Stop Query & Resume Function
        function endQueryAndResume() {
            stopAllAudio();
            isAnswering = false;
            isInterrupted = false;

            const bar = document.getElementById('interrupt-bar');
            bar.classList.remove('active');
            document.getElementById('stop-resume-btn').style.display = 'none';
            document.getElementById('question-input').value = "";
            document.getElementById('interrupt-status-text').innerText = "▶️ Resuming podcast where Host A & Host B left off...";

            // Resume automatically from exact line index where paused
            playScript(currentLineIndex);
        }

        function stopAllAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
